<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PR.47" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/modern.css" />
  <title>PR.47</title>
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="app-header">
    <div class="app-logo">
      <img class="logo-svg" src="icons/SVG/Recurso 7.svg" alt="PR.47" />
    </div>
    <span id="page-title">Timer</span>
  </header>

  <!-- ======= MAIN CONTENT ======= -->
  <main id="app-content">

    <!-- ===== TIMER SECTION ===== -->
    <section id="section-timer" class="section active">
      <div class="timer-top">
        <div class="tab-bar">
          <button class="tab-btn active" data-tab="stopwatch">Cronómetro</button>
          <button class="tab-btn" data-tab="interval">Timer</button>
        </div>
        <button id="timer-settings-btn" class="icon-btn icon-btn--box timer-gear" title="Sonido y vibración" aria-label="Sonido y vibración">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a10 10 0 010 14"/></svg>
        </button>
      </div>

      <!-- STOPWATCH -->
      <div id="tab-stopwatch" class="tab-content active">
        <div class="clock-display">
          <div class="sw-time-wrap">
            <span id="sw-main">00:00</span><span id="sw-ms" class="sw-ms">.00</span>
          </div>
        </div>
        <div class="sw-controls-row">
          <button id="sw-lap" class="sw-btn-secondary" disabled>LAP</button>
          <button id="sw-toggle" class="btn-toggle" aria-label="Play / Pause">
            <svg id="sw-icon-play" width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <svg id="sw-icon-pause" class="hidden" width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>
        </div>
        <div id="sw-laps" class="sw-laps"></div>
      </div>

      <!-- TIMER -->
      <div id="tab-interval" class="tab-content">
        <div id="interval-config" class="card timer-card">
          <div class="card-title">Configurar Timer</div>
          <div class="preset-row" id="timer-presets">
            <button class="preset-chip" data-p="10,20,10,8,1">Tabata</button>
            <button class="preset-chip" data-p="10,30,15,6,1">30 / 15</button>
            <button class="preset-chip" data-p="10,40,20,6,1">40 / 20</button>
            <button class="preset-chip" data-p="10,45,15,5,1">45 / 15</button>
            <button class="preset-chip" data-p="10,60,30,4,2">60 / 30</button>
          </div>
          <div class="config-grid">
            <div class="config-group config-group--full">
              <label>Preparación</label>
              <div class="stepper">
                <button class="step-btn" data-for="prep-sec" data-d="-5" aria-label="Menos">−</button>
                <div class="sec-field"><input type="number" id="prep-sec" class="sec-input" min="0" value="10" inputmode="numeric" /><span>segundos</span></div>
                <button class="step-btn" data-for="prep-sec" data-d="5" aria-label="Más">+</button>
              </div>
            </div>
            <div class="config-group">
              <label>Ejercicio</label>
              <div class="stepper stepper--sm">
                <button class="step-btn" data-for="ex-sec" data-d="-5" aria-label="Menos">−</button>
                <div class="sec-field"><input type="number" id="ex-sec" class="sec-input" min="1" value="30" inputmode="numeric" /><span>segundos</span></div>
                <button class="step-btn" data-for="ex-sec" data-d="5" aria-label="Más">+</button>
              </div>
            </div>
            <div class="config-group">
              <label>Descanso</label>
              <div class="stepper stepper--sm">
                <button class="step-btn" data-for="rest-sec" data-d="-5" aria-label="Menos">−</button>
                <div class="sec-field"><input type="number" id="rest-sec" class="sec-input" min="0" value="15" inputmode="numeric" /><span>segundos</span></div>
                <button class="step-btn" data-for="rest-sec" data-d="5" aria-label="Más">+</button>
              </div>
            </div>
            <div class="config-group">
              <label>Sets</label>
              <div class="stepper stepper--sm">
                <button class="step-btn" data-for="sets-count" data-d="-1" aria-label="Menos">−</button>
                <div class="sec-field"><input type="number" id="sets-count" min="1" value="3" class="sec-input" inputmode="numeric" /><span>× round</span></div>
                <button class="step-btn" data-for="sets-count" data-d="1" aria-label="Más">+</button>
              </div>
            </div>
            <div class="config-group">
              <label>Rounds</label>
              <div class="stepper stepper--sm">
                <button class="step-btn" data-for="rounds-count" data-d="-1" aria-label="Menos">−</button>
                <div class="sec-field"><input type="number" id="rounds-count" min="1" value="1" class="sec-input" inputmode="numeric" /><span>vueltas</span></div>
                <button class="step-btn" data-for="rounds-count" data-d="1" aria-label="Más">+</button>
              </div>
            </div>
          </div>
          <div class="timer-total"><span>Duración total</span><b id="cfg-total">06:30</b></div>
          <button id="interval-go" class="btn btn-primary btn-xl btn-full">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Iniciar
          </button>
        </div>

        <!-- RUNNING -->
        <div id="interval-running" class="hidden">
          <!-- Tiempo total del circuito — chip arriba -->
          <div class="it-circuit-chip">
            <span id="it-total-time">00:00</span>
          </div>
          <!-- Fase activa -->
          <div id="phase-badge" class="phase-badge phase-exercise">Ejercicio</div>
          <div class="progress-ring-container">
            <svg class="progress-ring" viewBox="0 0 250 250">
              <circle class="progress-ring-bg" cx="125" cy="125" r="115" />
              <circle id="progress-arc" class="progress-ring-fill" cx="125" cy="125" r="115" />
            </svg>
            <div class="progress-inner">
              <span id="it-display">00:30</span>
            </div>
          </div>
          <div class="status-row">
            <div class="status-chip">
              <span class="status-label">Set</span>
              <span id="it-set">1 / 3</span>
            </div>
            <div class="status-chip">
              <span class="status-label">Round</span>
              <span id="it-round">1 / 1</span>
            </div>
          </div>
          <!-- Single toggle button + reset -->
          <div class="it-controls">
            <button id="it-pause" class="btn-it-toggle" aria-label="Pause / Resume">
              <svg id="it-icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
              </svg>
              <svg id="it-icon-play" class="hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
            </button>
            <button id="it-reset" class="btn-it-reset" aria-label="Reset">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== CALENDAR SECTION ===== -->
    <section id="section-calendar" class="section">
      <div class="view-toggle">
        <button class="view-btn active" data-view="agenda">Agenda</button>
        <button class="view-btn" data-view="month">Mes</button>
      </div>
      <div class="calendar-nav">
        <button id="cal-prev" class="nav-btn" aria-label="Anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="cal-title-wrap">
          <span id="cal-title" class="cal-title"></span>
          <button id="cal-today" class="cal-today-btn hidden">Hoy</button>
        </div>
        <button id="cal-next" class="nav-btn" aria-label="Siguiente">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div id="calendar-grid"></div>
      <div id="day-agenda"></div>
    </section>

    <!-- ===== USERS SECTION ===== -->
    <section id="section-users" class="section">
      <div id="users-list-view">
        <div class="backup-row">
          <button id="export-routines-btn" class="btn btn-secondary btn-sm">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Exportar rutinas
          </button>
          <button id="import-routines-btn" class="btn btn-secondary btn-sm">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Importar rutinas
          </button>
          <input type="file" id="import-routines-input" accept="application/json,.json" class="hidden" />
        </div>
        <div class="search-wrap">
          <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
          <input id="global-search" class="form-input search-input" type="search" placeholder="Buscar rutina o ejercicio…" autocomplete="off" />
          <button id="global-search-clear" class="search-clear hidden" aria-label="Borrar búsqueda">✕</button>
        </div>
        <div id="search-results" class="hidden"></div>
        <div id="users-grid"></div>
      </div>

      <div id="user-detail-view" class="hidden">
        <button id="back-to-users" class="back-btn-standalone">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          Volver
        </button>
        <div class="user-profile-header user-profile-header--compact">
          <div id="user-avatar-large" class="avatar-large avatar-large--sm"></div>
          <div class="uph-info">
            <h2 id="user-detail-name"></h2>
            <div id="user-detail-meta" class="uph-meta"></div>
          </div>
          <div class="user-actions-row">
            <button id="edit-user-btn" class="icon-btn icon-btn--box" title="Editar alumno" aria-label="Editar alumno">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button id="delete-user-btn" class="icon-btn icon-btn--box icon-btn--danger" title="Eliminar alumno" aria-label="Eliminar alumno">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </div>

        <!-- RAÍZ DEL ALUMNO: carpetas + tabla de pesos -->
        <div id="folders-section">
          <button id="generate-routine-root-btn" class="btn btn-accent btn-full" style="margin:0 0 16px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            Generar rutina
          </button>
          <div class="routines-header">
            <h3>Carpetas</h3>
            <button id="add-folder-btn" class="btn btn-secondary btn-sm">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Carpeta
            </button>
          </div>
          <div id="folders-grid"></div>
          <button id="weights-table-btn" class="wt-tile">
            <span class="wt-tile-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="9" x2="12" y2="21"/></svg></span>
            <span class="wt-tile-text"><b>Tabla de pesos</b><small id="weights-tile-sub">Los últimos pesos de cada ejercicio</small></span>
            <span class="wt-tile-go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </button>
        </div>

        <!-- DENTRO DE UNA CARPETA: sus rutinas -->
        <div id="folder-section" class="hidden">
          <div class="folder-head">
            <span id="folder-head-icon" class="folder-head-icon"></span>
            <h3 id="folder-title"></h3>
            <button id="edit-folder-btn" class="icon-btn icon-btn--box" title="Editar carpeta" aria-label="Editar carpeta">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
            </button>
          </div>
          <div class="folder-actions">
            <button id="add-routine-btn" class="btn btn-primary btn-sm">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Nueva
            </button>
            <button id="copy-routine-btn" class="btn btn-secondary btn-sm">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              Copiar de…
            </button>
            <button id="generate-routine-btn" class="btn btn-accent btn-sm">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
              Generar
            </button>
          </div>
          <div id="routines-list"></div>
        </div>
      </div>

      <div id="weights-view" class="hidden"></div>

      <div id="routine-detail-view" class="hidden">
        <div class="routine-header-bar">
          <button id="back-to-user" class="back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
            Volver
          </button>
          <h3 id="routine-detail-name"></h3>
          <button id="edit-routine-btn" class="btn btn-secondary btn-sm">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Editar
          </button>
        </div>
        <div id="exercises-list"></div>
        <button id="add-exercise-btn" class="btn btn-primary btn-full" style="margin-top:0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Ejercicio
        </button>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="add-break-btn" class="btn btn-secondary btn-full" style="margin-top:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="10" y1="15" x2="10" y2="9"/><line x1="14" y1="15" x2="14" y2="9"/></svg>
            Pausa
          </button>
          <button id="add-speed-btn" class="btn btn-secondary btn-full" style="margin-top:0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Velocidad
          </button>
        </div>
        <button id="assign-to-cal-btn" class="btn btn-secondary btn-full hidden" style="margin-top:8px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          Asignar al calendario
        </button>
        <button id="run-routine-btn" class="btn btn-accent btn-full" style="margin-top:8px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
          Cronometrar rutina
        </button>
        <button id="weights-btn" class="btn btn-secondary btn-full" style="margin-top:8px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          Actualizar pesos
        </button>
        <button id="pdf-routine-btn" class="btn btn-secondary btn-full" style="margin-top:8px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Descargar PDF
        </button>
      </div>
    </section>

  </main>

  <!-- FAB — fuera del contenedor scrollable para que siempre sea visible -->
  <button id="add-user-btn" class="fab hidden" aria-label="Agregar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- ======= BOTTOM NAV ======= -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-section="timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
      </svg>
      <span>Reloj</span>
    </button>
    <button class="nav-item" data-section="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>
      </svg>
      <span>Agenda</span>
    </button>
    <button class="nav-item" data-section="users">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 014-4h6a4 4 0 014 4v2"/>
        <path d="M19 8v6M22 11h-6"/>
      </svg>
      <span>Usuarios</span>
    </button>
  </nav>

  <!-- ======= MODAL ======= -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
